<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>map-engine example</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="map-container">
        <canvas id="map"></canvas>
        <div id="status">Loading map…</div>
      </div>

      <aside id="sidebar">
        <h1>map-engine</h1>

        <section id="hover-panel">
          <h2>Hover</h2>
          <div id="hover-content" class="empty-state">— none —</div>
        </section>

        <section id="selected-panel">
          <h2>Selected</h2>
          <div id="selected-content" class="empty-state">
            — click a sector —
          </div>
        </section>

        <section id="advanced-panel">
          <h2>Advanced (registry)</h2>
          <div id="advanced-content"></div>
        </section>

        <section id="frame-hook-panel">
          <h2>Frame Hook</h2>
          <div id="frame-counter">Frames: 0</div>
        </section>

        <section id="clock-panel">
          <h2>Game Clock</h2>
          <div id="tick-counter">Ticks: 0</div>
          <div id="clock-speed">Speed: 1×</div>
          <div class="clock-controls">
            <button id="btn-clock-pause">Pause</button>
            <button id="btn-clock-speed-half">0.5×</button>
            <button id="btn-clock-speed-1">1×</button>
            <button id="btn-clock-speed-2">2×</button>
            <button id="btn-clock-speed-5">5×</button>
          </div>
        </section>

        <section id="neighbor-panel">
          <h2>Neighbors</h2>
          <div id="neighbor-output">—</div>
        </section>

        <section id="controls-panel">
          <h2>Controls</h2>
          <label class="toggle">
            <input type="checkbox" id="chk-hover" checked />
            Hover highlighting
          </label>
          <button id="btn-reload">Reload engine</button>
        </section>

        <section id="sector-list-panel">
          <h2>All sectors (<span id="sector-count">0</span>)</h2>
          <ul id="sector-list"></ul>
        </section>
      </aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
